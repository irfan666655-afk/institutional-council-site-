name: council-data
on:
  push:
    branches: [council-data]
    paths: ['request.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: council-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save dukascopy-node@1.51.0
      - run: node scripts/fetch.mjs
      - name: Commit data
        run: |
          git config user.name "council-data-bot"
          git config user.email "council-data-bot@users.noreply.github.com"
          git add data status.json
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || echo "no changes"
          git pull --rebase origin council-data
          git push origin HEAD:council-data
